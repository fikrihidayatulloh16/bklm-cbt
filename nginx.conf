events {
    worker_connections 1024;
}

http {
    # 1. Buat Format Log Kustom (Tambahkan req_id di bagian akhir)
    log_format tracing_format '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              'req_id="$request_id"'; # 👈 Ini kuncinya!

    # 2. Gunakan format log tersebut
    access_log /var/log/nginx/access.log tracing_format;

    server {
        listen 80;

        # 1. Rute untuk Backend (NestJS)
        location /api/ {
            # Hapus akhiran /api/ agar Nginx meneruskan URI persis seperti aslinya
            proxy_pass http://api:3000;

            # 3. Lempar stempel ID ini ke NestJS melalui Header
            proxy_set_header X-Request-Id $request_id;
            
            # 4. (Opsional) Kembalikan stempel ini ke Browser/Frontend
            add_header X-Request-Id $request_id;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # 🚨 WAJIB ADA untuk Google OAuth & Cloudflare Tunnel
            proxy_set_header X-Forwarded-Proto $scheme; 
        }

        # Rute untuk WebSocket(socket.io)
        location /api/socket.io/ {
            proxy_pass http://api:3000;
            
            # Wajib untuk WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Header Identitas
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 🚨 TAMBAHAN BARU: Mencegah Nginx memutus koneksi websocket secara sepihak
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 2. Rute untuk Frontend (Next.js)
        # Selain /api/, semua halaman masuk ke Next.js
        location / {
            proxy_pass http://web:3000;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # 🚨 WAJIB ADA untuk HTTPS Next.js & Server Actions
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Konfigurasi khusus agar WebSocket (HMR lokal / Next.js Image Optimization) tetap jalan
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}